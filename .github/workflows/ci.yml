name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  
  backend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Validate Backend (Build & Test)
        run: ./mvnw -B verify
        working-dir: backend

  
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json # Mapeia o cache para o monorepo

      - name: Install dependencies
        run: npm ci
        working-dir: frontend

      - name: Run Linters
        run: npm run lint --if-present
        working-dir: frontend

      - name: Run Typecheck
        run: npx tsc --noEmit
        working-dir: frontend

      - name: Run Tests
        run: npm test -- --watchAll=false --passWithNoTests
        working-dir: frontend

      - name: Build Frontend
        run: npm run build
        working-dir: frontend
